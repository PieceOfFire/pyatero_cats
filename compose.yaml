# Optional local PostgreSQL for development and integration tests.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cats
      POSTGRES_PASSWORD: cats_local_only
      POSTGRES_DB: cats
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cats_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cats -d cats"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  cats_pg:
